# The enforcing suite on every push to dev and every pull request: build,
# fixtures, then `swift test` with SWIFTDC_REQUIRE_FIXTURES, under which a
# missing fixture fails instead of skipping (FixturePresenceTests; CI=true
# enforces it too). A pull request from a fork waits for a maintainer's
# approval before it runs; a push never does. The local integration gate (Tools/integration-gate.sh)
# also runs the release build, blast radius and cost budget, which need
# the previous revision's binary and are not repeated here.
name: ci
on:
  push:
    branches: [dev]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite:
    # Where it runs is the repository's choice. With the variable
    # SWIFTDC_SELF_HOSTED set to true (Tools/ci/setup-runner.sh sets it)
    # the suite runs on that repository's own Mac, labelled `swiftdc`,
    # which has the toolchain the fixtures need. Without it, it runs on
    # the newest hosted image that starts: `macos-26` stayed queued with
    # no runner for 50 minutes on 2026-11-13, and `macos-15` carries a
    # Swift too old to build the fixtures, so there the Toolchain step
    # fails by name instead of the fixture build failing obscurely.
    # docs/CI.md has the whole picture.
    runs-on: ${{ vars.SWIFTDC_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64", "swiftdc"]') || 'macos-15' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: runner.environment == 'github-hosted'
        with:
          go-version: stable
      - name: Select the newest Xcode
        if: runner.environment == 'github-hosted'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Toolchain
        # Prints the exact versions, so two runs can be compared, and
        # stops here when this machine cannot build the fixtures.
        run: Tools/ci/environment.sh
      - name: Fixtures
        run: |
          Tools/fixtures.sh || {
            # The build log names the source and flag the image's toolchain
            # rejected; without it the failure says nothing.
            find "$HOME/Library/Caches/swiftdc-fixtures" -name build.log -exec tail -60 {} \;
            exit 1
          }
      - name: Build
        run: swift build --build-tests 2>&1 | tee build.log; ! grep -q "error:" build.log
      - name: Enforcing suite
        run: |
          set -o pipefail
          SWIFTDC_REQUIRE_FIXTURES=1 swift test --skip-build 2>&1 | tee suite.log | grep -E "recorded an issue|Test run with"
      - name: Suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: |
            build.log
            suite.log
